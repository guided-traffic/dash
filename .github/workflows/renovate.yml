name: Renovate Application
on:
  # Run daily at 2 a.m. Berlin time
  schedule:
    - cron: '0 2 * * *'
      timezone: "Europe/Berlin"
  # Again as soon as the checks of one of its own pull requests finished green,
  # so Renovate merges it within minutes instead of on the next night, and
  # rebases what that merge put in conflict (docs/adr/0014 D2).
  workflow_run:
    workflows: ["Test and Release"]
    types: [completed]
    branches: ["renovate/**"]
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Renovate log level'
        required: false
        default: 'info'
        type: choice
        options:
          - info
          - debug
          - warn
          - error

permissions:
  contents: read

# One Renovate at a time: a run a check starts while another runs waits for it.
concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    # A run after checks only for a green run on a branch of this repository,
    # never for a fork's branch that happens to be named renovate/.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      # GitHub App installation token (guided-traffic-automation, organisation
      # secrets), scoped to this repository; expires after 1 h.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.12
        with:
          token: ${{ steps.app-token.outputs.token }}
          configurationFile: renovate.json
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_AUTODISCOVER: 'true'
          RENOVATE_AUTODISCOVER_FILTER: 'guided-traffic/dash'
          RENOVATE_REQUIRE_CONFIG: 'required'
